<title>MOG CHAD – Vagabundo Games</title>
<style>
:root{--bg:#120d1f;--card:#221a38;--tx:#f4f0ff;--ac:#ffcf3f;--ac2:#ff3f81;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(#2d1f55,#120d1f);z-index:5}
.scr.on{display:flex}
h1{font-size:2.5rem;margin:.2em 0;letter-spacing:2px;color:var(--ac);text-shadow:0 0 22px var(--ac2)}
.btn{background:var(--ac);color:#222;font-weight:800;padding:14px 34px;border-radius:30px;font-size:1.2rem;margin-top:18px}
#splash{animation:fade 3.2s forwards}@keyframes fade{0%,80%{opacity:1}100%{opacity:0;visibility:hidden}}
.logo{font-size:1.8rem;font-weight:900;letter-spacing:4px;animation:pop 1s}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#app{display:flex;flex-direction:column;height:100%}
#hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 2px}
#aura{font-size:1.3rem;font-weight:900;color:var(--ac)}
#lv{font-weight:800;font-size:.85rem}
#dots{display:flex;gap:3px;padding:0 12px}#dots i{flex:1;height:5px;border-radius:3px;background:#3a2f5c}#dots i.d{background:var(--ac)}#dots i.c{background:var(--ac2)}
#hpw{margin:6px 12px 2px;height:20px;background:#000;border-radius:10px;overflow:hidden;position:relative}
#fill{height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .1s}
#hpt{position:absolute;inset:0;text-align:center;font-size:.72rem;font-weight:800;line-height:20px}
#stage{flex:1;min-height:150px;position:relative;display:flex;align-items:flex-end;justify-content:space-around;background:linear-gradient(#352a63,#14101f);border-block:4px solid #ffcf3f33;overflow:hidden}
#stage:before,#stage:after{content:"";position:absolute;top:0;bottom:0;width:7px;background:#e8b800;opacity:.45}#stage:before{left:10%}#stage:after{right:10%}
.ch{height:92%;max-width:48%;transition:transform .08s}#foe{border-radius:14px;border:3px solid var(--ac);object-fit:cover;align-self:flex-end;height:80%;width:auto}
#foe.boss{border-color:#f33;box-shadow:0 0 24px #f33}#foe.hit{transform:translateX(8px) rotate(3deg)}
#me.tap{transform:scale(1.06)}.bump{animation:bump .45s}@keyframes bump{50%{transform:scale(1.18)}}
#fx{position:absolute;inset:0;pointer-events:none}.fl{position:absolute;font-weight:900;color:var(--ac);font-size:1.2rem;text-shadow:0 2px 4px #000;animation:up .9s forwards;white-space:nowrap}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#acts{display:flex;gap:8px;padding:6px 10px}
#tapbtn{flex:2;background:var(--ac2);font-weight:900;font-size:1.2rem;padding:13px;border-radius:16px}#tapbtn:active{transform:scale(.97)}
#alpha{flex:1;background:#6b3fff;font-weight:800;border-radius:16px;font-size:.85rem}#alpha:disabled{opacity:.5}
#tabs{display:flex;gap:6px;padding:0 10px}#tabs button{flex:1;padding:8px;border-radius:10px 10px 0 0;background:#2a2147;font-weight:700;font-size:.85rem}#tabs .on{background:var(--ac);color:#222}
#panel{height:30vh;overflow-y:auto;background:#1a1330;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px;align-content:start}
.up{background:var(--card);border-radius:12px;padding:8px;text-align:left;font-size:.75rem;border:2px solid transparent;min-height:62px}.up b{display:block;font-size:.88rem}.up.ok{border-color:var(--ac)}.up:not(.ok){opacity:.55}.up.eq{border-color:#3fff8a;opacity:1}
.trophy{font-size:7rem;animation:pop 1s}
</style></head><body>

{n:"Óculos escuros",d:"+2/s • estilo",c:60,g:1.3,a:2},{n:"Whey",d:"+15/s • massa",c:500,g:1.35,a:15},
{n:"Aura Sigma",d:"+90/s • aura brilha",c:3500,g:1.4,a:90},{n:"Creatina",d:"+40/toque • mais volume",c:9000,g:1.5,t:40},
{n:"Jawline Lendária",d:"+500/s • mandíbula dourada",c:25000,g:1.45,a:500},{n:"Rizz Infinito",d:"+4000/s • corações",c:150000,g:1.5,a:4000}];
const MSG=["🗿 Mandíbula esculpida!","💪 Mais forte!","🕶️ Óculos escuros!","🥤 Whey na mão!","🌟 Aura Sigma!","💉 Creatina: volume!","👑 Jawline lendária!","💘 Rizz infinito!"];
let S,tab=0;
function fresh(){return{l:0,aura:0,tap:1,auto:0,n:UP.map(()=>0),own:[1,0,0,0],sel:0,taps:0,aT:0,aC:0}}
function hpOf(l){return M.round(35*M.pow(1.85,l))}
function load(){try{const s=JSON.parse(localStorage.getItem("mogchad2"));if(s&&s.n&&s.n.length==UP.length)return s}catch(_){}return null}
function save(){try{localStorage.setItem("mogchad2",JSON.stringify(S))}catch(_){}}
const mult=()=>CH[S.sel].m;
const fmt=n=>n>=1e9?(n/1e9).toFixed(1)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":M.floor(n);
const cost=i=>M.ceil(UP[i].c*M.pow(UP[i].g,S.n[i]));
function float(t,x,y){const e=document.createElement("div");e.className="fl";e.textContent=t;e.style.left=x+"px";e.style.top=y+"px";$("fx").appendChild(e);setTimeout(()=>e.remove(),900)}
function drawMe(){
 const [m,a,g,w,s,cr,j,rz]=S.n,T=S.sel;
 const bulk=M.min(a,14)+M.min(w,10)*.6+M.min(cr,8)*.9;
 const sh=38+bulk*3,bi=7+M.min(a,14)*1.5+M.min(w,10)*.7+M.min(cr,8)*1.2;
 const jw=20+M.min(m,12)*3+M.min(j,10)*3+(T==2?14:0),ch=136+M.min(m,12)*1.5+M.min(j,10)*2+(T==2?6:0);
 const nk=16+bulk*1.1,hair=T==2?"#151515":"#e8c24a";
 const body=T==1?"#6b4a2e":T==3?"#7d8590":"url(#bd)";
 let o=`<defs><linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#f6c9a0"/><stop offset=".55" stop-color="#e0a373"/><stop offset="1" stop-color="#b9764d"/></linearGradient><linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#e9b189"/><stop offset="1" stop-color="#a8683f"/></linearGradient><radialGradient id="ag"><stop offset=".5" stop-color="#ffcf3f" stop-opacity=".4"/><stop offset="1" stop-color="#ff3f81" stop-opacity="0"/></radialGradient></defs>`;
 if(s>0){const r=100+s*16;o+=`<circle cx="100" cy="150" r="${r}" fill="url(#ag)"><animate attributeName="r" values="${r};${r+18};${r}" dur="1.2s" repeatCount="indefinite"/></circle>`}
 for(let i=0;i<M.min(rz,3);i++)o+=`<text x="${-30+i*120}" y="90" font-size="26">💘<animate attributeName="y" values="110;30" dur="${1.6+i*.4}s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="${1.6+i*.4}s" repeatCount="indefinite"/></text>`;
 for(const d of[-1,1]){const x=100+d*(sh+4);o+=`<rect x="${x-bi*.7}" y="165" width="${bi*1.4}" height="125" rx="${bi*.7}" fill="${body}"/><circle cx="${x}" cy="205" r="${bi}" fill="${body}"/><circle cx="${x+d*bi*.3}" cy="200" r="${bi*.5}" fill="#000" opacity=".15"/>`;if(a>=4)o+=`<path d="M${x-d*3} 190 q${d*6} 15 0 30" stroke="#b86b4a" stroke-width="2" fill="none"/>`}
 o+=`<path d="M${100-sh} 300 Q${100-sh-8} 185 ${100-sh+30} 158 L${100+sh-30} 158 Q${100+sh+8} 185 ${100+sh} 300Z" fill="#111"/><path d="M${100-nk-6} 150 L100 215 L${100+nk+6} 150Z" fill="#fff"/>`;
 if(a>=2)o+=`<path d="M${100-sh+34} 170 Q100 196 ${100+sh-34} 170" stroke="#444" stroke-width="3" fill="none"/>`;
 o+=`<text x="100" y="285" text-anchor="middle" font-size="22" font-weight="900" fill="#ffcf3f">${T==1?"BABUÍNO":T==3?"SIGMA":"CHAD"}</text><rect x="${100-nk}" y="115" width="${nk*2}" height="45" fill="${body}"/><rect x="${100-nk}" y="115" width="${nk*2}" height="45" fill="#000" opacity=".18"/>`;
 if(w>=1||a>=3)o+=`<path d="M${100-nk} 140 L${100-sh+10} 165 L${100+sh-10} 165 L${100+nk} 140Z" fill="${body}"/>`;
 if(w>=1)o+=`<g transform="translate(${100-sh-bi-6} 235) rotate(-12)"><rect width="26" height="46" rx="5" fill="#2a7de1"/><rect y="-8" width="26" height="10" rx="3" fill="#fff"/><text x="13" y="30" font-size="9" font-weight="900" text-anchor="middle" fill="#fff">WHEY</text></g>`;
 const gold=j>0?`stroke="#ffcf3f" stroke-width="${2+M.min(j,6)}"`:"";
 const hasG=g>=1;
 if(T==1){const rw=28+M.min(m,12)*1.4+M.min(j,10);
  o+=`<ellipse cx="100" cy="68" rx="62" ry="64" fill="#4a3320"/><ellipse cx="100" cy="85" rx="46" ry="54" fill="#8a6a48" ${gold}/><ellipse cx="100" cy="112" rx="${rw}" ry="${26+M.min(m,12)}" fill="#c49a78"/><path d="M${100-rw} 86 L${100-rw-10} 122 L${100-rw+10} 118Z" fill="#3f78d8"/><path d="M${100+rw} 86 L${100+rw+10} 122 L${100+rw-10} 118Z" fill="#3f78d8"/><ellipse cx="94" cy="102" rx="3" ry="5" fill="#5a2a2a"/><ellipse cx="106" cy="102" rx="3" ry="5" fill="#5a2a2a"/><rect x="60" y="56" width="80" height="13" rx="6" fill="#33210f"/>`;
  if(!hasG)o+=`<circle cx="80" cy="76" r="5" fill="#1a0f05"/><circle cx="120" cy="76" r="5" fill="#1a0f05"/><circle cx="82" cy="74" r="1.6" fill="#fff"/><circle cx="122" cy="74" r="1.6" fill="#fff"/>`;
  o+=`<path d="M84 ${ch-8} Q100 ${ch+2} 116 ${ch-8}" stroke="#3a1a1a" stroke-width="4" fill="none"/><path d="M90 ${ch-6} l4 10 4 -9zM110 ${ch-6} l-4 10 -4 -9z" fill="#fff"/>`}
 else if(T==3){o+=`<path d="M52 70 L58 6 L90 30Z M148 70 L142 6 L110 30Z" fill="#6c737d"/><path d="M60 62 Q100 -4 140 62 L128 108 L100 ${ch+8} L72 108Z" fill="#8b929c" ${gold}/><path d="M80 96 L100 ${ch+8} L120 96 Q100 82 80 96Z" fill="#d3d8de"/><ellipse cx="100" cy="${ch+2}" rx="9" ry="6" fill="#0a0a0a"/>`;
  if(!hasG)o+=`<path d="M64 74 L92 80 L84 66Z M136 74 L108 80 L116 66Z" fill="#ffd23f"/><circle cx="82" cy="75" r="2" fill="#000"/><circle cx="118" cy="75" r="2" fill="#000"/>`;
  o+=`<path d="M88 ${ch-4} l4 10 4 -9zM112 ${ch-4} l-4 10 -4 -9z" fill="#fff"/>`}
 else{o+=`<ellipse cx="50" cy="78" rx="7" ry="13" fill="#d89a6a"/><ellipse cx="150" cy="78" rx="7" ry="13" fill="#b9764d"/><path d="M52 65 Q52 16 100 16 Q148 16 148 65 L${100+jw} 112 L${100+jw*.7} ${ch} L${100-jw*.7} ${ch} L${100-jw} 112Z" fill="url(#sk)" ${gold}/><path d="M${100-jw} 112 L${100-jw*.7} ${ch} L${100+jw*.7} ${ch} L${100+jw} 112 Q100 ${ch-30} ${100-jw} 112Z" fill="#000" opacity=".17"/>`;
  if(m>=2)o+=`<path d="M62 92 Q72 110 86 120 M138 92 Q128 110 114 120" stroke="#9a5a36" stroke-width="${1+M.min(m,6)*.6}" fill="none" opacity=".55"/>`;
  o+=`<path d="M48 62 Q54 4 100 8 Q150 4 152 62 Q132 32 100 38 Q70 32 48 62Z" fill="${hair}"/><path d="M100 76 L95 100 Q100 105 105 100" stroke="#a5683f" stroke-width="3" fill="none"/>`;
  if(!hasG)o+=`<ellipse cx="78" cy="72" rx="9" ry="5" fill="#fff"/><ellipse cx="122" cy="72" rx="9" ry="5" fill="#fff"/><circle cx="78" cy="72" r="3.8" fill="#3b6a8c"/><circle cx="122" cy="72" r="3.8" fill="#3b6a8c"/><circle cx="78" cy="72" r="1.6"/><circle cx="122" cy="72" r="1.6"/><path d="M64 62 L92 63M136 62 L108 63" stroke="#2a1a0a" stroke-width="5"/>`;
  o+=`<path d="M84 ${ch-27} Q100 ${ch-36} 116 ${ch-27} Q100 ${ch-17} 84 ${ch-27}Z" fill="#b5594a"/>`}
 if(hasG){const gw=M.min(g,6),c=gw>=3?"#ffcf3f":"#000";o+=`<rect x="${60-gw}" y="60" width="${34+gw}" height="${22+gw}" rx="8" fill="#000" stroke="${c}" stroke-width="3"/><rect x="106" y="60" width="${34+gw}" height="${22+gw}" rx="8" fill="#000" stroke="${c}" stroke-width="3"/><line x1="94" y1="68" x2="106" y2="68" stroke="${c}" stroke-width="3"/><path d="M68 66 l12 0 -8 8z" fill="#fff" opacity=".6"/>`;if(gw>=4)o+=`<path d="M135 52 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" fill="#fff"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></path>`}
 $("me").innerHTML=o}
function pop(t){const e=$("me");e.classList.remove("bump");void e.getBoundingClientRect();e.classList.add("bump");float(t,30,50)}
function render(){
 const boss=S.l%5==4;
 $("lv").textContent="Fase "+(S.l+1)+"/15 – "+LV[S.l];$("aura").textContent="✨ "+fmt(S.aura);
 $("dots").innerHTML=LV.map((_,i)=>`<i class="${i<S.l?"d":i%5==4?"c":""}"></i>`).join("");
 const r=M.max(0,S.hp)/S.max;$("fill").style.width=r*100+"%";$("hpt").textContent=fmt(M.max(0,S.hp))+" / "+fmt(S.max);
 $("foe").className=boss?"boss":"";$("foe").style.filter=`grayscale(${(1-r)*.9})`;
 $("alpha").disabled=S.aT>0||S.aC>0;$("alpha").textContent=S.aT>0?"🔥 "+M.ceil(S.aT/10)/10*1+"s":S.aC>0?"⏳ "+M.ceil(S.aC/10)+"s":"🔥 MODO ALPHA";
 const p=$("panel");
 if(tab==0){UP.forEach((u,i)=>{let b=$("u"+i);if(!b){b=document.createElement("button");b.id="u"+i;b.onclick=()=>buy(i);p.appendChild(b)}b.className="up"+(S.aura>=cost(i)?" ok":"");b.innerHTML=`<b>${u.n} (${S.n[i]})</b>${u.d}<br>✨ ${fmt(cost(i))}`})}
 else CH.forEach((c,i)=>{let b=$("c"+i);if(!b){b=document.createElement("button");b.id="c"+i;b.onclick=()=>pick(i);p.appendChild(b)}b.className="up"+(S.sel==i?" eq":S.own[i]||S.aura>=c.c?" ok":"");b.innerHTML=`<b>${c.e} ${c.n}</b>Dano x${c.m}<br>${S.sel==i?"✅ Equipado":S.own[i]?"Equipar":"Comprar ✨ "+fmt(c.c)}`})}
function setTab(t){tab=t;$("t0").className=t?"":"on";$("t1").className=t?"on":"";$("panel").innerHTML="";render()}
$("t0").onclick=()=>setTab(0);$("t1").onclick=()=>setTab(1);
function buy(i){const c=cost(i);if(S.aura<c)return;S.aura-=c;S.n[i]++;if(UP[i].t)S.tap+=UP[i].t;if(UP[i].a)S.auto+=UP[i].a;drawMe();pop(MSG[i]);save();render()}
function pick(i){if(!S.own[i]){if(S.aura<CH[i].c)return;S.aura-=CH[i].c;S.own[i]=1}S.sel=i;drawMe();pop(CH[i].e+" "+CH[i].n+"!");save();render()}
function dmg(v,txt,x,y){
 S.hp-=v;S.aura+=v;if(txt&&x!==undefined)float(txt,x,y);
 if(S.hp<=0){const b=M.round(10*M.pow(1.7,S.l));S.aura+=b;float("MOGADO! +"+fmt(b)+" ✨",50,40);S.l++;save();
  if(S.l>=15){$("win").classList.add("on");return}
  S.hp=S.max=hpOf(S.l)}
 render()}
function tap(e){S.taps++;const crit=S.taps%10==0,v=S.tap*mult()*(S.aT>0?5:1)*(crit?3:1);
 const r=$("stage").getBoundingClientRect();const px=(e&&e.clientX?e.clientX:r.left+r.width/2)-r.left-20,py=(e&&e.clientY?e.clientY:r.top+r.height/2)-r.top-30;
 $("foe").classList.add("hit");$("me").classList.add("tap");setTimeout(()=>{$("foe").classList.remove("hit");$("me").classList.remove("tap")},80);
 if(navigator.vibrate)try{navigator.vibrate(crit?30:8)}catch(_){}
 dmg(v,(crit?"CRIT! ":"+")+fmt(v),M.max(10,px),M.max(10,py))}
$("tapbtn").onclick=tap;$("stage").onclick=tap;
$("alpha").onclick=()=>{if(S.aT<=0&&S.aC<=0){S.aT=80;S.aC=300;pop("🔥 MODO ALPHA! x5");render()}};
setInterval(()=>{if(!S||!$("splash")||$("menu").classList.contains("on")||$("win").classList.contains("on"))return;
 if(S.aT>0){S.aT--;if(S.aT==0)S.aC=300}else if(S.aC>0)S.aC--;
 if(S.auto)dmg(S.auto*mult()/10);else render()},100);
setTimeout(()=>$("menu").classList.add("on"),3000);
function start(s){S=s;S.hp=S.max=hpOf(S.l);S.aT=0;S.aC=0;$("panel").innerHTML="";drawMe();render()}
$("play").onclick=()=>{start(load()||fresh());$("menu").classList.remove("on")};
$("again").onclick=()=>{S.l=0;start(S);$("win").classList.remove("on")};
S=fresh();drawMe();render();
</script></body></html>
